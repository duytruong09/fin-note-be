name: Keep Render Service Alive

# Ping Render service mỗi 10 phút để tránh auto-sleep (Free tier sleep sau 15 phút)
# Lưu ý: GitHub Actions free tier giới hạn 2000 phút/tháng
# Cron job này sẽ dùng ~4.3 phút/ngày (144 pings/ngày * 0.03 phút/ping)

on:
  schedule:
    # Chạy mỗi 10 phút
    # Syntax: "minute hour day month day-of-week"
    # */10 = every 10 minutes
    - cron: '*/10 * * * *'

  # Cho phép trigger thủ công từ GitHub UI
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Health Endpoint
        run: |
          echo "Pinging Render service at $(date)"

          # Bỏ -f để curl không fail khi 4xx/5xx (Render có thể trả 404 khi đang wake-up)
          # Retry tối đa 3 lần vì service Free tier cần ~30-60s để wake
          URL="https://fin-note-api.onrender.com/api/v1/health"
          MAX_RETRIES=3
          RETRY_DELAY=20

          for i in $(seq 1 $MAX_RETRIES); do
            HTTP_CODE=$(curl -s -S -o /dev/null -w "%{http_code}" "$URL")
            echo "Attempt $i/$MAX_RETRIES - Response code: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ Service is healthy"
              exit 0
            fi

            if [ $i -lt $MAX_RETRIES ]; then
              echo "⏳ Waiting ${RETRY_DELAY}s before retry (service may be waking up)..."
              sleep $RETRY_DELAY
            fi
          done

          echo "⚠️ Service returned non-200 after $MAX_RETRIES attempts (may be waking up)"
          # Luôn exit 0 để không trigger failure email
          exit 0

      - name: Log Result
        if: always()
        run: |
          echo "Keep-alive ping completed at $(date)"
